name: AI Daily Briefing

on:
  schedule:
    # 工作日每天早上 9 点 (UTC+8 = UTC 1:00)
    - cron: '0 1 * * 1-5'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Daily Briefing
        run: node ai-daily-briefing.js reports

      - name: Commit and Push Report
        run: |
          git config --global user.name 'AI Daily Briefing Bot'
          git config --global user.email 'bot@ai-daily-briefing'
          git add reports/
          # 如果 reports 目录有变化才 commit
          git diff --staged --quiet || git commit -m "📊 AI Daily Briefing - $(date +'%Y-%m-%d')"
          git push
